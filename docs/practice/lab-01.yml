name: lab-01
on:
  push:
    paths:
      - .github/workflows/lab-01.yml
  workflow_dispatch:
jobs:
  hello:
    runs-on: ubuntu-24.04
    steps:
      - name: 인사
        run: echo "첫 워크플로 실행 성공"
      # TODO [1-1] 러너의 커널 정보와 CPU 개수를 출력하는 스텝을 추가합니다.
      - name: 러너의 커널 정보와 CPU 개수 출력
        run: |
          uname -a
          nproc
      # TODO [1-2] 현재 작업 폴더의 파일 목록을 출력하는 스텝을 추가합니다.
      - name: 받기 전 파일 목록
        run: ls -la
      # TODO [1-3] 저장소 코드를 러너로 받아 온 뒤, 다시 파일 목록을 출력합니다.
      - name: 코드 받아오기
        uses: actions/checkout@v7
      - name: 코드 받아온 후 파일 목록
        run: ls -la

      - name: 두 가지 OS 확인
        run: |
          echo "셸이 본 것: $(uname -s)"
          echo "Actions가 준 것: ${{ runner.os }}"
      # 미션 1 더알아보기
      - name: 실행 번호
        run: echo "이 워크플로의 ${{ github.run_number }}번째 실행"